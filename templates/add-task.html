{% extends "base.html" %}

{% set current_page = 'add-task' %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/add-task.css') }}">
{% endblock %}

{% block title %}Add task{% endblock %}

{% block content %}
<div class="add-task-container">
    <form class="add-task-box" action="/add-task", method="POST">
        <h2>할 일을 기록하세요</h2>
        
        {% if error %}
        <div class="error">{{error}}</div>
        {% elif complete %}
        <div class="complete">{{complete}}</div>
        {% endif %} 


        <!-- required "이 제출폼을 입력하세요" 뜨게하기 -->
        <div class="input-container">
            <div class="input">
                <label for="task-date">할 일 날짜</label>
                <input type="number" id="task-date" name="task-date" placeholder=" " required/>
            </div>
            <div class="input">
                <label for="task-name">할 일 이름</label>
                <input type="text" id="task-name" name="task-name" placeholder=" " required/>
            </div>
            
            <div class="color-category">
                <label for="color">색깔</label>
                <select name="color" id="color">
                    <option value="red">빨강</option>
                    <option value="green">초록</option>
                    <option value="blue">파랑</option>
                </select>
            </div>
        </div>

        <button type="submit">할 일 기록하기</button>
    </form>
</div>
{% endblock %}
