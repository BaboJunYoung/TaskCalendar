{% block styles %}

{% endblock %}

{% block title %}Welcome{% endblock %}

{% block content %}
<div class="index-container">

        <h2 class="index-title">이 캘린더 사이트에 오신 것을 환영합니다!</h2>

        </p>
        <div class="index-features">
            <p>💡 먼저 로그인을 한 뒤 사용해주세요</p>
        </div>
    </div>

{% endblock %}
