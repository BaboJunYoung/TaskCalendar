{% extends "base.html" %}

{% set current_page = 'login' %}

{% block styles %}
<link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}">
{% endblock %}

{% block title %}Login{% endblock %}

{% block content %}
<div class="login-container">
    <form class="login-box" action="/login", method="POST">
        <h2>일정 데이터에<br>접근하기 위해 로그인</h2>

        {% if error %}
        <div class="error">{{error}}</div>
        {% endif %}
        
        <!-- required "이 제출폼을 입력하세요" 뜨게하기 -->
        <div class="input-container">
            <div class="input">
                <input type="text" id="username" name="username" placeholder=" " required/>
                <label for="username">유저이름</label>
            </div>
            <div class="input">
                <input type="password" id="password" name="password" placeholder=" " required/>
                <label for="password">비밀번호</label>
            </div>
        </div>

        <button type="submit">로그인하기</button>

        <div class="other-container">
            <a href="/reset-password">비밀번호를 잊으셨나요?</a>
            <a href="/register">계정 만들기</a>
        </div>
    </form>
</div>
{% endblock %}
