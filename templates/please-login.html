{% extends "base.html" %}

{% block styles %}
<style>
    .screen {
        display: flex;
        flex-direction: row;
        justify-content: center;
        align-items: center;

        width: 100%;
        height: 100%;
    }
    .container {
        display: flex;
        flex-direction: column;
        justify-content: space-between;
        align-items: center;

        width: wrap;
        height: 200px;
    }
    .container > p {
        color: black;
    }
    .container > a {
        font-size: 36px;
        color: blue;
        font-weight: 900;
    }
</style>
{% endblock %}

{% block title %}{{title}}<h5>근데이제로그인을안한</h5>{% endblock %}

{% block content %}
<div class="screen">
    <div class="container">
        <h1>로그인 후 이용해주세요!</h1>
        <a href="/login">로그인하러가기</a>
    </div>
</div>
{% endblock %}
